---
name: graduate-me-backend
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: graduate_me
      POSTGRES_PASSWORD: graduate_me_local
      POSTGRES_DB: graduate_me
    ports:
      - 127.0.0.1:15432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U graduate_me -d graduate_me
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: '.'
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://graduate_me:graduate_me_local@db:5432/graduate_me
      API_PORT: '4000'
      AUTH_URL: '${AUTH_URL:-http://localhost:3000}'
      ADMIN_URL: '${ADMIN_URL:-http://localhost:3001}'
      AUTH_SECRET: '${AUTH_SECRET:-}'
      AUTH_GOOGLE_ID: '${AUTH_GOOGLE_ID:-}'
      AUTH_GOOGLE_SECRET: '${AUTH_GOOGLE_SECRET:-}'
      ADMIN_EMAILS: '${ADMIN_EMAILS:-}'
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - default
      - app
  worker:
    build:
      context: '.'
      dockerfile: Dockerfile.worker
    init: true
    environment:
      DATABASE_URL: postgresql://graduate_me:graduate_me_local@db:5432/graduate_me
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GEMINI_MODEL: '${GEMINI_MODEL:-gemini-3.8-flash}'
      YOUTUBE_API_KEY: '${YOUTUBE_API_KEY:-}'
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
    name: '${POSTGRES_VOLUME_NAME:-graduate-me_postgres_data}'
networks:
  app:
    name: graduate-me-app
